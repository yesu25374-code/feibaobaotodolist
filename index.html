<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>小小鱼每日待办</title>
  <meta name="theme-color" content="#ff8fb3" id="themeColorMeta">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#151923" id="themeColorDarkMeta">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="小小鱼每日待办">
  <meta name="application-name" content="小小鱼每日待办">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" id="appleStatusBarMeta">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-v2.png">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    :root {
      --bg: #f7fbff;
      --surface: #ffffff;
      --surface-soft: #eef7fb;
      --text: #263238;
      --muted: #6d7c85;
      --primary: #ff8fb3;
      --primary-strong: #e95d91;
      --accent: #39b7c9;
      --border: rgba(38, 50, 56, 0.12);
      --shadow: 0 20px 60px rgba(44, 62, 80, 0.12);
      --done: #9aa8ae;
      --danger: #ef6b68;
      --wheel-a: #ffb8cc;
      --wheel-b: #8bdde8;
      --wheel-c: #ffe08a;
      --wheel-d: #a8e6b1;
    }

    [data-theme="dark"] {
      --bg: #151923;
      --surface: #202635;
      --surface-soft: #2a3143;
      --text: #eef4f7;
      --muted: #aab6c0;
      --primary: #7dd3fc;
      --primary-strong: #38bdf8;
      --accent: #f9a8d4;
      --border: rgba(255, 255, 255, 0.12);
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.3);
      --done: #7f8a96;
      --danger: #fb8d89;
      --wheel-a: #7dd3fc;
      --wheel-b: #c4b5fd;
      --wheel-c: #f9a8d4;
      --wheel-d: #86efac;
    }

    [data-theme="pink"] {
      --bg: #fff5f8;
      --surface-soft: #ffe8f0;
      --primary: #ff76a8;
      --primary-strong: #e64f89;
      --accent: #ffb86b;
      --wheel-a: #ff9cbe;
      --wheel-b: #ffd1df;
      --wheel-c: #ffc46f;
      --wheel-d: #b7eed4;
    }

    [data-theme="blue"] {
      --bg: #eff8ff;
      --surface-soft: #dff1ff;
      --primary: #48a7ff;
      --primary-strong: #1678d6;
      --accent: #20c6b4;
      --wheel-a: #64b5ff;
      --wheel-b: #a7e5ff;
      --wheel-c: #8ee6d5;
      --wheel-d: #ffe08a;
    }

    [data-theme="green"] {
      --bg: #f2fff7;
      --surface-soft: #def8e7;
      --primary: #49c783;
      --primary-strong: #229b5d;
      --accent: #4cb6d6;
      --wheel-a: #7ee2a8;
      --wheel-b: #c7f2d5;
      --wheel-c: #8ed7ee;
      --wheel-d: #ffd184;
    }

    [data-theme="purple"] {
      --bg: #fbf7ff;
      --surface-soft: #f0e6ff;
      --primary: #a97cff;
      --primary-strong: #7c4de6;
      --accent: #ff8fb3;
      --wheel-a: #b99bff;
      --wheel-b: #e1d3ff;
      --wheel-c: #ffb0cf;
      --wheel-d: #93e5d0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background:
        radial-gradient(circle at top left, var(--surface-soft), transparent 32rem),
        linear-gradient(135deg, var(--bg), var(--surface-soft));
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: min(1080px, calc(100% - 32px));
      margin: 0 auto;
      padding: max(28px, env(safe-area-inset-top)) 0 max(48px, env(safe-area-inset-bottom));
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .logo {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      box-shadow: 0 12px 30px color-mix(in srgb, var(--primary) 28%, transparent);
      color: #fff;
      font-size: 24px;
      font-weight: 800;
      flex: 0 0 auto;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 5vw, 48px);
      letter-spacing: 0;
      line-height: 1.05;
    }

    .subtitle {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 15px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
    }

    .sync-btn {
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      color: var(--text);
      font-weight: 700;
      box-shadow: 0 8px 24px rgba(25, 45, 64, 0.08);
    }

    .sync-btn.is-active {
      background: var(--surface-soft);
      color: var(--primary-strong);
    }

    .theme-picker {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: color-mix(in srgb, var(--surface) 86%, transparent);
      box-shadow: 0 8px 24px rgba(25, 45, 64, 0.08);
    }

    .theme-dot {
      width: 28px;
      height: 28px;
      border: 2px solid transparent;
      border-radius: 50%;
      background: var(--dot);
      color: transparent;
    }

    .theme-dot.is-active {
      border-color: var(--text);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 24%, transparent);
    }

    .avatar-button {
      width: 58px;
      height: 58px;
      padding: 0;
      border: 3px solid var(--surface);
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      box-shadow: 0 14px 34px rgba(25, 45, 64, 0.16);
      overflow: hidden;
    }

    .avatar-button img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .panel {
      border: 1px solid var(--border);
      border-radius: 24px;
      background: color-mix(in srgb, var(--surface) 93%, transparent);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }

    .habit-dock {
      position: relative;
      z-index: 12;
      margin: -8px 0 18px;
    }

    .habit-ticker {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      width: min(520px, 100%);
      min-height: 58px;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: color-mix(in srgb, var(--surface) 88%, transparent);
      color: var(--text);
      box-shadow: 0 14px 34px rgba(25, 45, 64, 0.1);
      backdrop-filter: blur(14px);
      text-align: left;
    }

    .habit-label {
      display: inline-grid;
      place-items: center;
      min-height: 32px;
      padding: 0 10px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .habit-viewport {
      position: relative;
      display: block;
      min-width: 0;
      height: 26px;
      overflow: hidden;
      font-weight: 800;
    }

    .habit-viewport span {
      position: absolute;
      inset: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      line-height: 26px;
      transform: translateY(0);
    }

    .habit-viewport.is-rolling span {
      animation: habitRoll 0.44s ease both;
    }

    .habit-meta {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .habit-popover {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      width: min(620px, 100%);
      max-height: min(70vh, 540px);
      overflow: auto;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: var(--surface);
      box-shadow: 0 28px 70px rgba(25, 45, 64, 0.22);
    }

    .habit-popover[hidden] {
      display: none !important;
    }

    .habit-popover-head,
    .habit-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .habit-popover-head {
      margin-bottom: 12px;
    }

    .habit-popover-head h2 {
      margin: 0;
      font-size: 20px;
    }

    .habit-form {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(110px, 150px) auto;
      gap: 10px;
      margin-bottom: 12px;
    }

    .habit-list {
      display: grid;
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .habit-row {
      min-height: 58px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-left: 7px solid var(--habit-color, var(--primary));
      border-radius: 18px;
      background: color-mix(in srgb, var(--surface) 90%, var(--surface-soft) 10%);
    }

    .habit-row-main {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .habit-row-text {
      display: grid;
      gap: 3px;
      min-width: 0;
    }

    .habit-title {
      overflow-wrap: anywhere;
      font-weight: 800;
    }

    .habit-row.done-today .habit-title {
      color: var(--done);
      text-decoration: line-through;
    }

    .habit-note {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .habit-row-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
    }

    @keyframes habitRoll {
      0% {
        opacity: 0;
        transform: translateY(100%);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .todo-panel {
      padding: clamp(18px, 4vw, 32px);
      margin-bottom: 24px;
    }

    .reminder-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 50px;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface);
      color: var(--muted);
      font-size: 14px;
      white-space: nowrap;
    }

    .reminder-toggle input {
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
    }

    .field {
      min-height: 50px;
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface);
      color: var(--text);
      outline: none;
      padding: 0 16px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .field:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--primary) 20%, transparent);
    }

    .primary-btn,
    .ghost-btn,
    .icon-btn {
      min-height: 44px;
      border: 0;
      border-radius: 16px;
      transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
    }

    .primary-btn {
      padding: 0 22px;
      background: linear-gradient(135deg, var(--primary), var(--primary-strong));
      color: #fff;
      font-weight: 700;
      box-shadow: 0 12px 24px color-mix(in srgb, var(--primary) 28%, transparent);
    }

    .primary-btn:hover,
    .ghost-btn:hover,
    .icon-btn:hover {
      transform: translateY(-1px);
    }

    .ghost-btn {
      padding: 0 14px;
      border: 1px solid var(--border);
      background: var(--surface-soft);
      color: var(--text);
      font-weight: 650;
    }

    .icon-btn {
      display: grid;
      place-items: center;
      width: 42px;
      min-height: 42px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-weight: 800;
    }

    .icon-btn.danger {
      color: var(--danger);
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .section-head h2 {
      margin: 0;
      font-size: 22px;
    }

    .stats {
      color: var(--muted);
      font-size: 14px;
      white-space: nowrap;
    }

    .head-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
    }

    .pager-head {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .pager-title {
      min-width: 0;
      text-align: center;
    }

    .pager-title h2,
    .pager-title h3 {
      margin: 0;
      overflow-wrap: anywhere;
      font-size: 22px;
      line-height: 1.25;
    }

    .pager-subtitle {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
    }

    .pager-arrow {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: var(--surface);
      color: var(--text);
      font-size: 28px;
      line-height: 1;
      transition: transform 0.2s, opacity 0.2s, background 0.2s;
    }

    .pager-arrow:hover:not(:disabled) {
      transform: translateY(-1px);
      background: var(--surface-soft);
    }

    .pager-arrow:disabled {
      cursor: not-allowed;
      opacity: 0.35;
    }

    .slide-frame {
      overflow: hidden;
    }

    .slide-page {
      transform: translateX(0);
      opacity: 1;
    }

    .slide-left-enter {
      transform: translateX(100%);
      opacity: 0;
    }

    .slide-right-enter {
      transform: translateX(-100%);
      opacity: 0;
    }

    .slide-active {
      transform: translateX(0);
      opacity: 1;
      transition: all 0.3s ease;
    }

    .todo-readonly {
      display: block;
      margin: -4px 0 14px;
      color: var(--muted);
      font-size: 14px;
      text-align: center;
    }

    .wheel-manager {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .wheel-tools {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .todo-list,
    .option-list {
      display: grid;
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .todo-item,
    .option-item {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 12px;
      min-height: 62px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--surface);
    }

    .todo-item {
      grid-template-columns: auto auto auto minmax(0, 1fr) auto;
      border-left: 7px solid var(--todo-color, var(--primary));
      touch-action: pan-y;
      user-select: none;
    }

    .todo-item.is-dragging {
      opacity: 0.72;
      box-shadow: 0 18px 38px rgba(25, 45, 64, 0.18);
      transform: scale(1.015);
      z-index: 4;
      background: color-mix(in srgb, var(--surface) 86%, var(--primary) 14%);
    }

    .todo-item.is-editing {
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--todo-color, var(--primary)) 25%, transparent);
    }

    .drag-handle {
      display: grid;
      place-items: center;
      width: 28px;
      height: 42px;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: var(--muted);
      cursor: grab;
      font-size: 18px;
      line-height: 1;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    .drag-handle:active {
      cursor: grabbing;
    }

    .mini-toggle {
      width: 34px;
      min-height: 34px;
      padding: 0;
      border-radius: 999px;
      font-size: 16px;
      line-height: 1;
    }

    .compact-btn {
      min-height: 36px;
      padding: 0 12px;
      border-radius: 999px;
      font-size: 13px;
    }

    .sort-actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 4px;
    }

    .sort-step {
      width: 28px;
      min-height: 22px;
      border-radius: 10px;
      font-size: 12px;
    }

    .check {
      width: 28px;
      height: 28px;
      accent-color: var(--primary);
    }

    .todo-text {
      display: grid;
      gap: 3px;
      min-width: 0;
    }

    .todo-title {
      overflow-wrap: anywhere;
      font-weight: 700;
    }

    .todo-date {
      color: var(--muted);
      font-size: 13px;
    }

    .todo-meta,
    .todo-note {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .todo-meta {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .todo-item.done .todo-title {
      color: var(--done);
      text-decoration: line-through;
    }

    .todo-editor {
      display: grid;
      grid-template-columns: 1fr 150px;
      gap: 10px;
      align-items: center;
    }

    .todo-editor .field:first-child,
    .modal-actions {
      grid-column: 1 / -1;
    }

    .todo-modal {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: grid;
      place-items: center;
      padding: 18px;
    }

    .todo-modal[hidden] {
      display: none !important;
    }

    .todo-modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(25, 33, 45, 0.32);
      backdrop-filter: blur(8px);
    }

    .todo-modal-card {
      position: relative;
      width: min(560px, 100%);
      max-height: min(86vh, 720px);
      overflow: auto;
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: var(--surface);
      box-shadow: 0 28px 70px rgba(25, 45, 64, 0.22);
    }

    .modal-close {
      position: absolute;
      top: 10px;
      right: 10px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding-top: 4px;
    }

    .item-actions {
      display: flex;
      gap: 8px;
    }

    .empty {
      padding: 26px 16px;
      border: 1px dashed var(--border);
      border-radius: 18px;
      color: var(--muted);
      text-align: center;
    }

    .undo-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 16px;
      background: var(--surface-soft);
      color: var(--text);
      font-size: 14px;
    }

    .wheel-panel {
      padding: clamp(18px, 4vw, 32px);
    }

    .wheel-layout {
      display: grid;
      grid-template-columns: minmax(260px, 430px) 1fr;
      gap: 28px;
      align-items: start;
    }

    .wheel-stage {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 430px;
    }

    .pointer {
      position: absolute;
      top: 13px;
      z-index: 2;
      width: 0;
      height: 0;
      border-left: 16px solid transparent;
      border-right: 16px solid transparent;
      border-top: 30px solid var(--primary-strong);
      filter: drop-shadow(0 8px 8px rgba(0, 0, 0, 0.18));
    }

    #wheelCanvas {
      width: min(100%, 390px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--surface);
      box-shadow: inset 0 0 0 10px var(--surface), 0 18px 42px rgba(25, 45, 64, 0.17);
    }

    .wheel-center {
      position: absolute;
      display: grid;
      place-items: center;
      width: 94px;
      height: 94px;
      border: 8px solid var(--surface);
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff;
      box-shadow: 0 10px 24px rgba(25, 45, 64, 0.2);
      font-weight: 800;
      text-align: center;
    }

    .wheel-controls {
      display: grid;
      gap: 16px;
    }

    .option-form {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 10px;
    }

    .option-item {
      grid-template-columns: 1fr auto;
      min-height: 54px;
    }

    .option-item.selected {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--primary) 18%, transparent);
    }

    .is-collapsed {
      display: none !important;
    }

    .option-text {
      overflow-wrap: anywhere;
      font-weight: 700;
    }

    .result {
      min-height: 48px;
      padding: 12px 14px;
      border-radius: 16px;
      background: var(--surface-soft);
      color: var(--text);
      font-weight: 700;
      text-align: center;
    }

    const todayDate = today();

    let currentAngle = 0;

    let draggedTodoId = null;
    let touchSortTimer = null;

    let pointerSortingItem = null;
    let pointerSortStart = null;

    function load(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch {
        return fallback;
      }
    }

    function save(key, value) {
      localStorage.setItem(key, JSON.stringify(value));
    }

    function syncConfigured() {
      return Boolean(supabaseConfig.url && supabaseConfig.anonKey);
    }

    function syncHeaders() {
      return {
        apikey: supabaseConfig.anonKey,
        Authorization: `Bearer ${supabaseConfig.anonKey}`,
        "Content-Type": "application/json"
      };
    }

    function syncRpcEndpoint(functionName) {
      const baseUrl = supabaseConfig.url.replace(/\/$/, "");
      return `${baseUrl}/rest/v1/rpc/${functionName}`;
    }

    function allTodoDates() {
      return Object.keys(localStorage)
        .filter((key) => key.startsWith("todos_"))
        .map((key) => key.replace("todos_", ""))
        .sort();
    }

    function collectSyncData() {
      const dailyTodos = {};
      allTodoDates().forEach((date) => {
        dailyTodos[date] = normalizeTodos(load(todoKey(date), []), date);
      });

      return {
        version: 1,
        savedAt: new Date().toISOString(),
        dailyTodos,
        habits,
        wheels,
        currentWheelIndex,
        theme: localStorage.getItem(storageKeys.theme) || "light",
        avatar: localStorage.getItem(storageKeys.avatar) || ""
      };
    }

    function syncContentScore(data) {
      if (!data || typeof data !== "object") return 0;

      const todoScore = Object.values(data.dailyTodos || {}).reduce((total, items) => {
        return total + (Array.isArray(items) ? items.length * 10 : 0);
      }, 0);

      const wheelScore = normalizeWheels(data.wheels || []).reduce((total, wheel, index) => {
        const optionCount = Array.isArray(wheel.options) ? wheel.options.length : 0;
        const extraWheelWeight = index > 0 ? 5 : 0;
        return total + optionCount + extraWheelWeight;
      }, 0);

      const habitScore = normalizeHabits(data.habits || []).length * 6;

      return todoScore + wheelScore + habitScore;
    }

    async function syncBestAvailableData(cloudRow) {
      const cloudData = cloudRow?.data || null;
      const localData = collectSyncData();
      const localScore = syncContentScore(localData);
      const cloudScore = syncContentScore(cloudData);

      if (localScore > cloudScore) {
        await pushCloudData(syncCode);
        return true;
      }

      if (cloudData) {
        applySyncData(cloudData);
        localStorage.setItem(storageKeys.syncUpdatedAt, cloudRow.updated_at || cloudData.savedAt || new Date().toISOString());
        return true;
      }

      if (localScore > 0) {
        await pushCloudData(syncCode);
        return true;
      }

      return false;
    }

    function applySyncData(data) {
      if (!data || typeof data !== "object") return;
      applyingCloudData = true;

      Object.entries(data.dailyTodos || {}).forEach(([date, items]) => {
        const localItems = normalizeTodos(load(todoKey(date), []), date);
        const cloudItems = normalizeTodos(items, date);
        const merged = [...localItems];
        cloudItems.forEach((cloudTodo) => {
          const existingIndex = merged.findIndex((localTodo) => localTodo.id === cloudTodo.id);
          if (existingIndex >= 0) {
            merged[existingIndex] = { ...merged[existingIndex], ...cloudTodo };
          } else {
            merged.push(cloudTodo);
          }
        });
        save(todoKey(date), merged);
      });

      habits = mergeHabits(habits, data.habits || []);
      save(storageKeys.habits, habits);

      wheels = normalizeWheels(data.wheels || []);
      if (!wheels.length) {
        wheels = [{ id: "default-wheel", name: "默认转盘", options: normalizeWheelOptions([]) }];
      }
      currentWheelIndex = Math.max(0, Math.min(Number(data.currentWheelIndex) || 0, wheels.length - 1));
      save(storageKeys.wheels, wheels);
      localStorage.setItem(storageKeys.currentWheelIndex, String(currentWheelIndex));

      if (data.theme) applyTheme(data.theme);
      if (data.avatar) {
        localStorage.setItem(storageKeys.avatar, data.avatar);
        avatarPreview.src = data.avatar;
      }

      renderHabits();
      loadTodosByDate(currentDate);
      loadWheel(currentWheelIndex);
      applyingCloudData = false;
    }

    async function refreshCloudSync() {
      if (!syncConfigured() || !syncCode) return;
      try {
        const cloudRow = await pullCloudData(syncCode);
        await syncBestAvailableData(cloudRow);
      } catch (error) {
        console.warn(error.message || "云同步刷新失败");
      } finally {
        updateSyncButton();
      }
    }

    async function bootstrapCloudData() {
      if (!syncConfigured() || !syncCode) return false;
      try {
        const cloudRow = await pullCloudData(syncCode);
        const synced = await syncBestAvailableData(cloudRow);
        if (!synced) return false;
        updateSyncButton();
        return true;
      } catch (error) {
        console.warn(error.message || "云同步启动失败");
        return false;
      }
    }

    function updateSyncButton() {
      syncButton.classList.toggle("is-active", Boolean(syncCode));
      if (!syncConfigured()) {
        syncButton.textContent = "云同步未配置";
      } else if (syncCode) {
        syncButton.textContent = `同步中：${syncCode}`;
      } else {
        syncButton.textContent = "云同步";
      }
    }

    async function pullCloudData(code) {
      const response = await fetch(syncRpcEndpoint("xiaoxiaoyu_pull"), {
        method: "POST",
        headers: syncHeaders(),
        body: JSON.stringify({ p_sync_code: code })
      });
      if (!response.ok) throw new Error("读取云端数据失败");
      const rows = await response.json();
      return rows[0] || null;
    }

    async function pushCloudData(code = syncCode) {
      if (!syncConfigured() || !code) return;
      const payload = collectSyncData();
      const response = await fetch(syncRpcEndpoint("xiaoxiaoyu_push"), {
        method: "POST",
        headers: syncHeaders(),
        body: JSON.stringify({
          p_sync_code: code,
          p_data: payload,
          p_updated_at: payload.savedAt
        })
      });
      if (!response.ok) throw new Error("保存云端数据失败");
      localStorage.setItem(storageKeys.syncUpdatedAt, payload.savedAt);
    }

    function queueCloudSave() {
      if (cloudSavePaused || applyingCloudData || !syncConfigured() || !syncCode) return;
      window.clearTimeout(syncTimer);
      syncTimer = window.setTimeout(() => {
        pushCloudData().catch((error) => console.warn(error.message));
      }, 600);
    }

    async function enableCloudSync() {
      if (!syncConfigured()) {
        alert("云同步还没配置 Supabase。先创建 Supabase 项目，并把 URL 和 anon key 填进代码。");
        return;
      }

      const code = prompt("输入同步码。手机和 iPad 使用同一个同步码就会互通。", syncCode || "");
      if (code === null) return;
      const cleanCode = code.trim();
      if (!cleanCode) return;

      syncButton.disabled = true;
      syncButton.textContent = "同步中...";
      try {
        const cloudRow = await pullCloudData(cleanCode);
        syncCode = cleanCode;
        localStorage.setItem(storageKeys.syncCode, syncCode);

        if (cloudRow?.data) {
          const cloudTime = Date.parse(cloudRow.updated_at || cloudRow.data.savedAt || 0);
          const localTime = Date.parse(localStorage.getItem(storageKeys.syncUpdatedAt) || 0);
          const localScore = syncContentScore(collectSyncData());
          const cloudScore = syncContentScore(cloudRow.data);
          if (localScore > cloudScore) {
            await pushCloudData(syncCode);
          } else if (cloudScore > localScore || cloudTime >= localTime) {
            applySyncData(cloudRow.data);
          } else {
            await pushCloudData(syncCode);
          }
        } else {
          await pushCloudData(syncCode);
        }

        alert("云同步已开启。另一台设备输入同一个同步码即可互通。");
      } catch (error) {
        alert(error.message || "同步失败，请稍后再试。");
      } finally {
        syncButton.disabled = false;
        updateSyncButton();
      }
    }

    function normalizeWheelOptions(value) {
      const source = Array.isArray(value) ? value : [];
      return source
        .map((item, index) => {
          if (typeof item === "string") return { id: uid(), title: item };
          if (item && typeof item.title === "string") return { id: item.id || uid(), title: item.title };
          return null;
        })
        .filter((item) => item && item.title.trim())
        .map((item) => ({ id: item.id, title: item.title.trim() }));
    }

    function normalizeTodos(value, fallbackDate = todayDate) {
      const source = Array.isArray(value) ? value : [];
      return source
        .map((item, index) => {
          if (!item) return null;
          const title = item.title || item.text;
          if (typeof title !== "string" || !title.trim()) return null;
          return {
            id: item.id || uid(),
            title: title.trim(),
            date: item.date || item.createdAt || fallbackDate,
            done: Boolean(item.done),
            note: item.note || "",
            time: item.time || "",
            place: item.place || "",
            color: item.color || item.priorityColor || "#ff8fb3",
            reminder: Boolean(item.reminder),
            order: Number.isFinite(Number(item.order)) ? Number(item.order) : index
          };
        })
        .filter(Boolean);
    }

    function normalizeHabits(value) {
      const source = Array.isArray(value) ? value : [];
      return source
        .map((item, index) => {
          if (!item) return null;
          const title = item.title || item.text;
          if (typeof title !== "string" || !title.trim()) return null;
          const completions = item.completions && typeof item.completions === "object" ? item.completions : {};
          return {
            id: item.id || uid(),
            title: title.trim(),
            color: item.color || "#ff8fb3",
            createdAt: item.createdAt || new Date().toISOString(),
            order: Number.isFinite(Number(item.order)) ? Number(item.order) : index,
            completions
          };
        })
        .filter(Boolean);
    }

    function mergeHabits(localValue, cloudValue) {
      const merged = normalizeHabits(localValue);
      normalizeHabits(cloudValue).forEach((cloudHabit) => {
        const index = merged.findIndex((localHabit) => localHabit.id === cloudHabit.id);
        if (index >= 0) {
          merged[index] = {
            ...merged[index],
            ...cloudHabit,
            completions: {
              ...(merged[index].completions || {}),
              ...(cloudHabit.completions || {})
            }
          };
        } else {
          merged.push(cloudHabit);
        }
      });
      return merged.sort((a, b) => Number(a.order) - Number(b.order));
    }

    function normalizeWheels(value) {
      const source = Array.isArray(value) ? value : [];
      return source
        .map((wheel, index) => {
          if (!wheel) return null;
          const name = typeof wheel.name === "string" && wheel.name.trim() ? wheel.name.trim() : `转盘 ${index + 1}`;
          const options = normalizeWheelOptions(wheel.options || []);
          return { id: wheel.id || uid(), name, options };
        })
        .filter(Boolean);
    }

    function uid() {
      return `${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function formatDateKey(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function today() {
      return formatDateKey(new Date());
    }

    function todoKey(dateStr) {
      return `todos_${dateStr}`;
    }

    function toLocalDate(dateStr) {
      return new Date(`${dateStr}T00:00:00`);
    }

    function shiftDate(dateStr, days) {
      const date = toLocalDate(dateStr);
      date.setDate(date.getDate() + days);
      return formatDateKey(date);
    }

    function isTodayPage() {
      return currentDate === todayDate;
    }

    function formatCurrentDateLabel(dateStr) {
      const date = toLocalDate(dateStr);
      const month = date.getMonth() + 1;
      const day = date.getDate();
      const weekday = date.toLocaleDateString("zh-CN", { weekday: "long" });
      return `${month}月${day}日 ${weekday}${dateStr === todayDate ? " 今天" : ""}`;
    }

    function formatDate(value) {
      if (!value) return "未设置日期";
      const date = new Date(`${value}T00:00:00`);
      return date.toLocaleDateString("zh-CN", { month: "long", day: "numeric", weekday: "short" });
    }

    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[char]);
    }

    function runSlide(element, direction) {
      element.classList.remove("slide-left-enter", "slide-right-enter", "slide-active");
      element.classList.add(direction === "left" ? "slide-left-enter" : "slide-right-enter");
      element.getBoundingClientRect();
      element.classList.add("slide-active");
      window.setTimeout(() => {
        element.classList.remove("slide-left-enter", "slide-right-enter", "slide-active");
      }, 320);
    }

    function setupSwipe(element, onLeft, onRight) {
      let startX = 0;
      let startY = 0;

      element.addEventListener("touchstart", (event) => {
        const touch = event.touches[0];
        startX = touch.clientX;
        startY = touch.clientY;
      }, { passive: true });

      element.addEventListener("touchend", (event) => {
        const touch = event.changedTouches[0];
        const deltaX = touch.clientX - startX;
        const deltaY = touch.clientY - startY;
        if (Math.abs(deltaX) <= 50 || Math.abs(deltaX) <= Math.abs(deltaY)) return;
        if (deltaX < 0) onLeft();
        if (deltaX > 0) onRight();
      }, { passive: true });
    }

    function migrateTodoStorage() {
      const legacyTodos = normalizeTodos(load(storageKeys.todos, []), todayDate);
      if (!legacyTodos.length || localStorage.getItem(todoKey(todayDate))) return;
      const grouped = legacyTodos.reduce((acc, todo) => {
        const date = todo.date || todayDate;
        acc[date] ||= [];
        acc[date].push(todo);
        return acc;
      }, {});
      Object.entries(grouped).forEach(([date, items]) => save(todoKey(date), items));
    }

    function migrateWheelStorage() {
      const existing = normalizeWheels(load(storageKeys.wheels, []));
      if (existing.length) {
        wheels = existing;
        currentWheelIndex = Math.min(Number(localStorage.getItem(storageKeys.currentWheelIndex)) || 0, wheels.length - 1);
        return;
      }

      const legacyOptions = normalizeWheelOptions(load(storageKeys.options, ["整理桌面", "读 20 分钟书", "散步 15 分钟", "完成最重要的一件事"]));
      wheels = [{ id: "default-wheel", name: "默认转盘", options: legacyOptions }];
      currentWheelIndex = 0;
      save(storageKeys.wheels, wheels);
      localStorage.setItem(storageKeys.currentWheelIndex, "0");
    }

    function saveCurrentTodos() {
      save(todoKey(currentDate), todos);
      queueCloudSave();
    }

    function saveHabits() {
      habits = normalizeHabits(habits).map((habit, index) => ({ ...habit, order: index }));
      save(storageKeys.habits, habits);
      queueCloudSave();
    }

    function completedTodayCount() {
      return habits.filter((habit) => habit.completions?.[todayDate]).length;
    }

    function currentTickerHabit() {
      if (!habits.length) return null;
      habitRollIndex = habitRollIndex % habits.length;
      return habits[habitRollIndex];
    }

    function renderHabitTicker(animate = false) {
      const habit = currentTickerHabit();
      if (!habit) {
        habitTickerText.textContent = "还没有长期习惯";
        habitTickerMeta.textContent = "点开添加";
        return;
      }

      const done = Boolean(habit.completions?.[todayDate]);
      habitTickerText.textContent = `${done ? "已完成 " : ""}${habit.title}`;
      habitTickerMeta.textContent = `${completedTodayCount()}/${habits.length} 今日`;
      if (animate) {
        habitViewport.classList.remove("is-rolling");
        habitViewport.getBoundingClientRect();
        habitViewport.classList.add("is-rolling");
      }
    }

    function startHabitRoller() {
      window.clearInterval(habitRollTimer);
      renderHabitTicker(false);
      if (habits.length <= 1) return;
      habitRollTimer = window.setInterval(() => {
        habitRollIndex = (habitRollIndex + 1) % habits.length;
        renderHabitTicker(true);
      }, 2600);
    }

    function renderHabits() {
      habits = normalizeHabits(habits);
      habitList.innerHTML = "";
      habitEmpty.classList.toggle("hidden", habits.length > 0);

      habits.forEach((habit) => {
        const isDone = Boolean(habit.completions?.[todayDate]);
        const item = document.createElement("li");
        item.className = `habit-row${isDone ? " done-today" : ""}`;
        item.dataset.id = habit.id;
        item.style.setProperty("--habit-color", habit.color || "#ff8fb3");
        item.innerHTML = `
          <div class="habit-row-main">
            <input class="check" type="checkbox" ${isDone ? "checked" : ""} aria-label="今日完成">
            <div class="habit-row-text">
              <span class="habit-title">${escapeHtml(habit.title)}</span>
              <span class="habit-note">${isDone ? "今天已经打卡" : "今天还没打卡"}</span>
            </div>
          </div>
          <div class="habit-row-actions">
            <button class="icon-btn" type="button" data-action="edit" title="编辑">✎</button>
            <button class="icon-btn danger" type="button" data-action="delete" title="删除">×</button>
          </div>
        `;
        habitList.appendChild(item);
      });

      startHabitRoller();
    }

    function addHabit(title, color) {
      habits.push({
        id: uid(),
        title: title.trim(),
        color,
        createdAt: new Date().toISOString(),
        order: habits.length,
        completions: {}
      });
      saveHabits();
      renderHabits();
    }

    function setHabitPopover(open) {
      habitPopover.hidden = !open;
      habitToggleButton.setAttribute("aria-expanded", String(open));
      if (open) requestAnimationFrame(() => habitInput.focus());
    }

    function loadTodosByDate(dateStr) {
      currentDate = dateStr;
      todos = normalizeTodos(load(todoKey(dateStr), []), dateStr);
      renderTodos();
    }

    function prevDay() {
      loadTodosByDate(shiftDate(currentDate, -1));
      runSlide(todoList, "right");
    }

    function nextDay() {
      loadTodosByDate(shiftDate(currentDate, 1));
      runSlide(todoList, "left");
    }

    function saveWheels() {
      save(storageKeys.wheels, wheels);
      localStorage.setItem(storageKeys.currentWheelIndex, String(currentWheelIndex));
      queueCloudSave();
    }

    function currentWheel() {
      return wheels[currentWheelIndex];
    }

    function loadWheel(index) {
      if (!wheels.length) migrateWheelStorage();
      currentWheelIndex = Math.max(0, Math.min(index, wheels.length - 1));
      const wheel = currentWheel();
      wheel.options = normalizeWheelOptions(wheel.options || []);
      wheelOptions = wheel.options;
      selectedOptionId = null;
      currentAngle = 0;
      localStorage.setItem(storageKeys.currentWheelIndex, String(currentWheelIndex));
      renderWheelShell();
      renderOptions();
      drawWheel();
    }

    function renderWheelShell() {
      const wheel = currentWheel();
      wheelTitle.textContent = wheel?.name || "默认转盘";
      wheelPageLabel.textContent = `${currentWheelIndex + 1} / ${wheels.length}`;
      prevWheelButton.disabled = currentWheelIndex === 0 || isSpinning;
      nextWheelButton.disabled = currentWheelIndex === wheels.length - 1 || isSpinning;
      editWheelButton.disabled = isSpinning;
      deleteWheelButton.disabled = currentWheelIndex === 0 || isSpinning;
    }

    function createNewWheel(name) {
      const cleanName = name.trim();
      if (!cleanName) return;
      wheels.push({ id: uid(), name: cleanName, options: [] });
      loadWheel(wheels.length - 1);
      runSlide(wheelSlide, "left");
    }

    function deleteCurrentWheel() {
      if (currentWheelIndex === 0 || wheels.length <= 1) return;
      const wheel = currentWheel();
      if (!confirm(`确定删除「${wheel.name}」吗？`)) return;
      wheels.splice(currentWheelIndex, 1);
      loadWheel(Math.min(currentWheelIndex, wheels.length - 1));
      runSlide(wheelSlide, "right");
    }

    function prevWheel() {
      if (currentWheelIndex <= 0 || isSpinning) return;
      loadWheel(currentWheelIndex - 1);
      runSlide(wheelSlide, "right");
    }

    function nextWheel() {
      if (currentWheelIndex >= wheels.length - 1 || isSpinning) return;
      loadWheel(currentWheelIndex + 1);
      runSlide(wheelSlide, "left");
    }

    function renderTodos() {
      todoList.innerHTML = "";
      todoEmpty.classList.toggle("hidden", todos.length > 0);
      todoEmpty.textContent = isTodayPage() ? "今天还没有待办，先加一件小事吧。" : "这一天还没有待办～";
      todoList.classList.toggle("is-collapsed", localStorage.getItem(storageKeys.todosCollapsed) === "true");
      todoEmpty.classList.toggle("is-collapsed", localStorage.getItem(storageKeys.todosCollapsed) === "true");
      const todosCollapsed = localStorage.getItem(storageKeys.todosCollapsed) === "true";
      collapseTodosButton.textContent = todosCollapsed ? "展开" : "折叠";
      collapseTodosButton.title = todosCollapsed ? "展开待办" : "折叠待办";
      collapseTodosButton.setAttribute("aria-label", collapseTodosButton.title);
      dateLabel.textContent = formatCurrentDateLabel(currentDate);
      nextDayButton.disabled = false;
      todoDate.value = currentDate;

      const doneCount = todos.filter((todo) => todo.done).length;
      todoStats.textContent = `${doneCount}/${todos.length} 已完成`;

      todos
        .slice()
        .sort((a, b) => (Number(a.order) - Number(b.order)) || (a.done - b.done) || (a.date || "").localeCompare(b.date || ""))
        .forEach((todo) => {
          const item = document.createElement("li");
          item.className = `todo-item${todo.done ? " done" : ""}${todo.id === editingTodoId ? " is-editing" : ""}`;
          item.dataset.id = todo.id;
          item.style.setProperty("--todo-color", todo.color || "#ff8fb3");
          const metaParts = [
            todo.time ? `时间：${escapeHtml(todo.time)}` : "",
            todo.place ? `地点：${escapeHtml(todo.place)}` : "",
            todo.reminder && todo.time ? "已开启提醒" : ""
          ].filter(Boolean);
          item.innerHTML = `
            <button class="drag-handle" type="button" draggable="true" data-sort-handle title="按住拖动排序" aria-label="按住拖动排序">⋮⋮</button>
            <div class="sort-actions" aria-label="调整顺序">
              <button class="icon-btn sort-step" type="button" data-action="move-up" title="上移">↑</button>
              <button class="icon-btn sort-step" type="button" data-action="move-down" title="下移">↓</button>
            </div>
            <input class="check" type="checkbox" ${todo.done ? "checked" : ""} aria-label="完成待办">
            <div class="todo-text">
              <span class="todo-title">${escapeHtml(todo.title)}</span>
              <span class="todo-date">${formatDate(todo.date)}</span>
              ${todo.note ? `<span class="todo-note">备注：${escapeHtml(todo.note)}</span>` : ""}
              ${metaParts.length ? `<span class="todo-meta">${metaParts.map((part) => `<span>${part}</span>`).join("")}</span>` : ""}
            </div>
            <div class="item-actions">
              <button class="icon-btn" type="button" data-action="edit" title="编辑">✎</button>
              <button class="icon-btn danger" type="button" data-action="delete" title="删除">×</button>
            </div>
          `;
          todoList.appendChild(item);
        });
    }

    function reorderTodos() {
      todos = [...todoList.querySelectorAll(".todo-item")]
        .map((item, index) => {
          const todo = todos.find((entry) => entry.id === item.dataset.id);
          if (todo) todo.order = index;
          return todo;
        })
        .filter(Boolean);
      saveCurrentTodos();
      renderTodos();
    }

    function moveTodo(todoId, direction) {
      const orderedTodos = todos
        .slice()
        .sort((a, b) => (Number(a.order) - Number(b.order)) || (a.done - b.done) || (a.date || "").localeCompare(b.date || ""));
      const index = orderedTodos.findIndex((todo) => todo.id === todoId);
      const nextIndex = index + direction;
      if (index < 0 || nextIndex < 0 || nextIndex >= orderedTodos.length) return;
      const [todo] = orderedTodos.splice(index, 1);
      orderedTodos.splice(nextIndex, 0, todo);
      todos = orderedTodos.map((entry, order) => ({ ...entry, order }));
      saveCurrentTodos();
      renderTodos();
    }

    function showUndo(todo, index) {
      lastDeletedTodo = { todo, index, date: currentDate };
      undoText.textContent = `已删除「${todo.title}」`;
      undoBar.classList.remove("hidden");
      window.clearTimeout(undoTimer);
      undoTimer = window.setTimeout(() => {
        undoBar.classList.add("hidden");
        lastDeletedTodo = null;
      }, 8000);
    }

    function resetTodoEditor(date = currentDate) {
      todoInput.value = "";
      todoDate.value = date;
      todoNote.value = "";
      todoTime.value = "";
      todoPlace.value = "";
      todoPriority.value = "#ff8fb3";
      todoReminder.checked = false;
    }

    function openTodoEditor(todo = null) {
      editingTodoId = todo?.id || null;
      editingTodoDate = todo ? currentDate : null;
      if (todo) {
        todoInput.value = todo.title || "";
        todoDate.value = todo.date || currentDate;
        todoTime.value = todo.time || "";
        todoPlace.value = todo.place || "";
        todoNote.value = todo.note || "";
        todoPriority.value = todo.color || "#ff8fb3";
        todoReminder.checked = Boolean(todo.reminder);
      } else {
        resetTodoEditor(currentDate);
      }
      todoSaveButton.textContent = todo ? "保存" : "添加";
      todoModal.hidden = false;
      document.body.style.overflow = "hidden";
      renderTodos();
      requestAnimationFrame(() => todoInput.focus());
    }

    function closeTodoEditor() {
      editingTodoId = null;
      editingTodoDate = null;
      todoModal.hidden = true;
      document.body.style.overflow = "";
      renderTodos();
    }

    function saveTodoEditor() {
      const title = todoInput.value.trim();
      if (!title) return;

      const targetDate = todoDate.value || currentDate;
      const formTodo = {
        title,
        date: targetDate,
        note: todoNote.value.trim(),
        time: todoTime.value,
        place: todoPlace.value.trim(),
        color: todoPriority.value,
        reminder: todoReminder.checked && Boolean(todoTime.value)
      };

      if (!editingTodoId) {
        if (targetDate !== currentDate) loadTodosByDate(targetDate);
        todos.push({
          id: uid(),
          ...formTodo,
          done: false,
          order: todos.length
        });
        saveCurrentTodos();
        closeTodoEditor();
      } else {
        const todo = todos.find((entry) => entry.id === editingTodoId);
        if (!todo) {
          closeTodoEditor();
          return;
        }

        const updatedTodo = { ...todo, ...formTodo };

        if (targetDate !== currentDate) {
          todos = todos.filter((entry) => entry.id !== editingTodoId);
          saveCurrentTodos();
          const targetTodos = normalizeTodos(load(todoKey(targetDate), []), targetDate);
          targetTodos.push({ ...updatedTodo, order: targetTodos.length });
          save(todoKey(targetDate), targetTodos);
          queueCloudSave();
          closeTodoEditor();
          loadTodosByDate(targetDate);
        } else {
          Object.assign(todo, updatedTodo);
          saveCurrentTodos();
          closeTodoEditor();
        }
      }

      scheduleReminders();
    }

    function remindedSet() {
      return new Set(load(storageKeys.remindedTodos, []));
    }

    function saveRemindedSet(set) {
      save(storageKeys.remindedTodos, [...set]);
    }

    async function ensureNotificationPermission() {
      if (!("Notification" in window)) return false;
      if (Notification.permission === "granted") return true;
      if (Notification.permission === "denied") return false;
      const permission = await Notification.requestPermission();
      return permission === "granted";
    }

    function todoReminderTime(todo) {
      if (!todo.reminder || !todo.time) return null;
      const date = new Date(`${todo.date}T${todo.time}:00`);
      return Number.isNaN(date.getTime()) ? null : date;
    }

    async function notifyTodo(todo) {
      const allowed = await ensureNotificationPermission();
      if (!allowed) return;
      new Notification(`待办提醒：${todo.title}`, {
        body: [todo.place ? `地点：${todo.place}` : "", todo.note || ""].filter(Boolean).join(" · ") || "到时间啦",
        tag: `todo-${todo.id}`
      });
    }

    function scheduleReminders() {
      const reminded = remindedSet();
      const now = Date.now();
      allTodoDates().forEach((date) => {
        normalizeTodos(load(todoKey(date), []), date).forEach((todo) => {
          const reminderTime = todoReminderTime(todo);
          if (!reminderTime || todo.done || reminded.has(todo.id)) return;
          const delay = reminderTime.getTime() - now;
          if (delay <= 0 && delay > -60000) {
            reminded.add(todo.id);
            notifyTodo(todo);
          } else if (delay > 0 && delay < 2147483647) {
            window.setTimeout(() => {
              const latest = remindedSet();
              if (latest.has(todo.id)) return;
              latest.add(todo.id);
              saveRemindedSet(latest);
              notifyTodo(todo);
            }, delay);
          }
        });
      });
      saveRemindedSet(reminded);
    }

    todoDate.addEventListener("change", () => {
      if (!todoDate.value || todoDate.value === currentDate) return;
      const direction = todoDate.value > currentDate ? "left" : "right";
      loadTodosByDate(todoDate.value);
      runSlide(todoList, direction);
    });

    todoReminder.addEventListener("change", () => {
      if (todoReminder.checked) ensureNotificationPermission();
    });

    habitToggleButton.addEventListener("click", () => {
      setHabitPopover(habitPopover.hidden);
    });

    closeHabitButton.addEventListener("click", () => setHabitPopover(false));

    habitForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const title = habitInput.value.trim();
      if (!title) return;
      addHabit(title, habitColor.value);
      habitInput.value = "";
      habitColor.value = "#ff8fb3";
    });

    habitList.addEventListener("click", (event) => {
      const item = event.target.closest(".habit-row");
      if (!item) return;
      const habit = habits.find((entry) => entry.id === item.dataset.id);
      if (!habit) return;

      if (event.target.matches(".check")) {
        habit.completions ||= {};
        if (event.target.checked) {
          habit.completions[todayDate] = new Date().toISOString();
        } else {
          delete habit.completions[todayDate];
        }
        saveHabits();
        renderHabits();
      }

      if (event.target.dataset.action === "edit") {
        const nextTitle = prompt("编辑长期习惯", habit.title);
        if (nextTitle !== null && nextTitle.trim()) {
          habit.title = nextTitle.trim();
          saveHabits();
          renderHabits();
        }
      }

      if (event.target.dataset.action === "delete") {
        if (!confirm(`确定删除「${habit.title}」吗？`)) return;
        habits = habits.filter((entry) => entry.id !== habit.id);
        habitRollIndex = Math.min(habitRollIndex, Math.max(0, habits.length - 1));
        saveHabits();
        renderHabits();
      }
    });

    newTodoButton.addEventListener("click", () => openTodoEditor());
    closeTodoEditorButton.addEventListener("click", closeTodoEditor);
    cancelTodoEditorButton.addEventListener("click", closeTodoEditor);
    todoModalBackdrop.addEventListener("click", closeTodoEditor);

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !todoModal.hidden) closeTodoEditor();
      if (event.key === "Escape" && !habitPopover.hidden) setHabitPopover(false);
    });

    document.addEventListener("click", (event) => {
      const path = event.composedPath ? event.composedPath() : [];
      if (habitPopover.hidden || habitDock.contains(event.target) || path.includes(habitDock)) return;
      setHabitPopover(false);
    });

    todoEditorForm.addEventListener("submit", (event) => {
      event.preventDefault();
      saveTodoEditor();
    });

    todoList.addEventListener("click", (event) => {
      const item = event.target.closest(".todo-item");
      if (!item) return;
      const todo = todos.find((entry) => entry.id === item.dataset.id);
      if (!todo) return;

      if (event.target.matches(".check")) {
        todo.done = event.target.checked;
      }

      if (event.target.dataset.action === "move-up") {
        moveTodo(todo.id, -1);
        return;
      }

      if (event.target.dataset.action === "move-down") {
        moveTodo(todo.id, 1);
        return;
      }

      if (event.target.dataset.action === "delete") {
        const deleteIndex = todos.findIndex((entry) => entry.id === todo.id);
        todos = todos.filter((entry) => entry.id !== todo.id);
        if (editingTodoId === todo.id) closeTodoEditor();
        showUndo(todo, deleteIndex);
      }

      if (event.target.dataset.action === "edit") {
        openTodoEditor(todo);
        return;
      }

      saveCurrentTodos();
      renderTodos();
      scheduleReminders();
    });

    todoList.addEventListener("dragstart", (event) => {
      const handle = event.target.closest("[data-sort-handle]");
      const item = event.target.closest(".todo-item");
      if (!handle || !item) return;
      draggedTodoId = item.dataset.id;
      item.classList.add("is-dragging");
      event.dataTransfer.effectAllowed = "move";
    });

    todoList.addEventListener("dragover", (event) => {
      event.preventDefault();
      const dragging = todoList.querySelector(".is-dragging");
      const target = event.target.closest(".todo-item");
      if (!dragging || !target || dragging === target) return;
      const rect = target.getBoundingClientRect();
      const after = event.clientY > rect.top + rect.height / 2;
      todoList.insertBefore(dragging, after ? target.nextSibling : target);
    });

    todoList.addEventListener("dragend", () => {
      const dragging = todoList.querySelector(".is-dragging");
      if (dragging) dragging.classList.remove("is-dragging");
      if (draggedTodoId) reorderTodos();
      draggedTodoId = null;
    });

    function startPointerSort(item) {
      if (pointerSortingItem === item) return;
      pointerSortingItem = item;
      draggedTodoId = item.dataset.id;
      item.classList.add("is-dragging");
      if (navigator.vibrate) navigator.vibrate(12);
    }

    function movePointerSort(clientX, clientY) {
      if (!pointerSortingItem) return;
      const target = document.elementFromPoint(clientX, clientY)?.closest(".todo-item");
      if (!target || target === pointerSortingItem || !todoList.contains(target)) return;
      const rect = target.getBoundingClientRect();
      const after = clientY > rect.top + rect.height / 2;
      todoList.insertBefore(pointerSortingItem, after ? target.nextSibling : target);
    }

    function finishPointerSort() {
      window.clearTimeout(pointerSortTimer);
      pointerSortTimer = null;
      pointerSortStart = null;
      if (!pointerSortingItem) return;
      pointerSortingItem.classList.remove("is-dragging");
      pointerSortingItem = null;
      if (draggedTodoId) reorderTodos();
      draggedTodoId = null;
    }

    todoList.addEventListener("pointerdown", (event) => {
      if (event.pointerType === "mouse" && !event.target.closest("[data-sort-handle]")) return;
      const item = event.target.closest(".todo-item");
      const handle = event.target.closest("[data-sort-handle]");
      if (!item || !handle) return;
      event.preventDefault();
      pointerSortStart = { x: event.clientX, y: event.clientY };
      window.clearTimeout(pointerSortTimer);
      startPointerSort(item);
      try {
        handle.setPointerCapture(event.pointerId);
      } catch {}
    });

    todoList.addEventListener("pointermove", (event) => {
      if (!pointerSortingItem) return;
      event.preventDefault();
      movePointerSort(event.clientX, event.clientY);
    });

    todoList.addEventListener("pointerup", finishPointerSort);
    todoList.addEventListener("pointercancel", finishPointerSort);

    todoList.addEventListener("touchstart", (event) => {
      const handle = event.target.closest("[data-sort-handle]");
      const item = event.target.closest(".todo-item");
      if (!handle || !item) return;
      event.preventDefault();
      touchSortingItem = item;
      startPointerSort(item);
    }, { passive: false });

    todoList.addEventListener("touchmove", (event) => {
      if (!touchSortingItem) return;
      event.preventDefault();
      const touch = event.touches[0];
      movePointerSort(touch.clientX, touch.clientY);
    }, { passive: false });

    todoList.addEventListener("touchend", () => {
      if (!touchSortingItem) return;
      touchSortingItem = null;
      finishPointerSort();
    });

    todoList.addEventListener("touchcancel", () => {
      window.clearTimeout(touchSortTimer);
      touchSortingItem = null;
      finishPointerSort();
    });

    undoDeleteButton.addEventListener("click", () => {
      if (!lastDeletedTodo) return;
      if (lastDeletedTodo.date !== currentDate) loadTodosByDate(lastDeletedTodo.date);
      todos.splice(lastDeletedTodo.index, 0, lastDeletedTodo.todo);
      saveCurrentTodos();
      renderTodos();
      scheduleReminders();
      undoBar.classList.add("hidden");
      lastDeletedTodo = null;
      window.clearTimeout(undoTimer);
    });

    collapseTodosButton.addEventListener("click", () => {
      const next = localStorage.getItem(storageKeys.todosCollapsed) !== "true";
      localStorage.setItem(storageKeys.todosCollapsed, String(next));
      renderTodos();
    });

    function applyTheme(theme) {
      const nextTheme = theme || "light";
      const chrome = themeChrome[nextTheme] || themeChrome.light;
      document.documentElement.dataset.theme = nextTheme === "light" ? "" : nextTheme;
      document.querySelectorAll("[data-theme-button]").forEach((button) => {
        button.classList.toggle("is-active", button.dataset.themeButton === nextTheme);
      });
      themeColorMeta.content = chrome.color;
      themeColorDarkMeta.content = chrome.darkColor;
      appleStatusBarMeta.content = chrome.statusBar;
      localStorage.setItem(storageKeys.theme, nextTheme);
      queueCloudSave();
      requestAnimationFrame(drawWheel);
    }

    document.querySelectorAll("[data-theme-button]").forEach((button) => {
      button.addEventListener("click", () => applyTheme(button.dataset.themeButton));
    });

    avatarButton.addEventListener("click", () => avatarInput.click());
    avatarInput.addEventListener("change", () => {
      const file = avatarInput.files?.[0];
      if (!file || !["image/jpeg", "image/png", "image/webp"].includes(file.type)) {
        alert("请选择 jpg、png 或 webp 图片。");
        return;
      }

      const reader = new FileReader();
      reader.onload = () => {
        const image = reader.result;
        avatarPreview.src = image;
        localStorage.setItem(storageKeys.avatar, image);
        queueCloudSave();
      };
      reader.readAsDataURL(file);
    });

    function cssVar(name) {
      return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    }

    function normalizeAngle(angle) {
      const full = Math.PI * 2;
      return ((angle % full) + full) % full;
    }

    function shortWheelText(text) {
      return text.length > 6 ? `${text.slice(0, 6)}…` : text;
    }

    function drawWheel() {
      const size = wheelCanvas.width;
      const center = size / 2;
      const radius = center - 18;
      const colors = [cssVar("--wheel-a"), cssVar("--wheel-b"), cssVar("--wheel-c"), cssVar("--wheel-d")];
      const items = wheelOptions.length ? wheelOptions : [{ title: "先添加选项" }];
      const segmentAngle = (Math.PI * 2) / items.length;

      wheelContext.clearRect(0, 0, size, size);
      wheelContext.save();
      wheelContext.translate(center, center);
      wheelContext.rotate(currentAngle - Math.PI / 2);

      items.forEach((item, index) => {
        const start = index * segmentAngle;
        const end = start + segmentAngle;
        const isSelected = item.id && item.id === selectedOptionId;

        wheelContext.beginPath();
        wheelContext.moveTo(0, 0);
        wheelContext.arc(0, 0, radius, start, end);
        wheelContext.closePath();
        wheelContext.fillStyle = colors[index % colors.length];
        wheelContext.fill();

        wheelContext.save();
        wheelContext.rotate(start + segmentAngle / 2);
        wheelContext.textAlign = "right";
        wheelContext.textBaseline = "middle";
        wheelContext.fillStyle = "#24313a";
        wheelContext.font = "700 30px Microsoft YaHei, sans-serif";
        wheelContext.fillText(shortWheelText(item.title), radius - 42, 0);
        wheelContext.restore();

        wheelContext.beginPath();
        wheelContext.moveTo(0, 0);
        wheelContext.arc(0, 0, radius, start, end);
        wheelContext.closePath();
        wheelContext.lineWidth = isSelected ? 18 : 3;
        wheelContext.strokeStyle = isSelected ? cssVar("--primary-strong") : "rgba(255, 255, 255, 0.7)";
        wheelContext.shadowColor = isSelected ? cssVar("--primary") : "transparent";
        wheelContext.shadowBlur = isSelected ? 18 : 0;
        wheelContext.stroke();
        wheelContext.shadowBlur = 0;
      });

      wheelContext.beginPath();
      wheelContext.arc(0, 0, radius, 0, Math.PI * 2);
      wheelContext.lineWidth = 14;
      wheelContext.strokeStyle = cssVar("--surface");
      wheelContext.stroke();

      wheelContext.beginPath();
      wheelContext.arc(0, 0, 66, 0, Math.PI * 2);
      wheelContext.fillStyle = cssVar("--surface");
      wheelContext.fill();
      wheelContext.restore();
    }

    function getResult(angle) {
      if (!wheelOptions.length) return null;
      const segmentAngle = (Math.PI * 2) / wheelOptions.length;
      const pointerAngle = normalizeAngle(-angle);
      const index = Math.floor(pointerAngle / segmentAngle) % wheelOptions.length;
      return { index, option: wheelOptions[index] };
    }

    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    function addOption(title) {
      wheelOptions.push({ id: uid(), title: title.trim() });
      selectedOptionId = null;
      saveWheels();
      renderOptions();
      drawWheel();
    }

    function deleteOption(index) {
      const [removed] = wheelOptions.splice(index, 1);
      if (removed?.id === selectedOptionId) selectedOptionId = null;
      saveWheels();
      renderOptions();
      drawWheel();
    }

    function spinWheel() {
      if (isSpinning || wheelOptions.length < 2) return;

      isSpinning = true;
      selectedOptionId = null;
      renderWheelShell();
      renderOptions();
      spinResult.textContent = "正在认真旋转...";

      const startAngle = currentAngle;
      const fullTurns = 5 + Math.floor(Math.random() * 4);
      const randomOffset = Math.random() * Math.PI * 2;
      const targetAngle = startAngle + fullTurns * Math.PI * 2 + randomOffset;
      const duration = 4200 + Math.random() * 800;
      const startTime = performance.now();

      function animate(now) {
        const progress = Math.min((now - startTime) / duration, 1);
        currentAngle = startAngle + (targetAngle - startAngle) * easeOutCubic(progress);
        drawWheel();

        if (progress < 1) {
          requestAnimationFrame(animate);
          return;
        }

        currentAngle = normalizeAngle(currentAngle);
        const result = getResult(currentAngle);
        if (result) {
          selectedOptionId = result.option.id;
          spinResult.textContent = `今天就做这件事！${result.option.title}`;
          alert(`今天就做这件事！\n${result.option.title}`);
        }
        isSpinning = false;
        renderWheelShell();
        renderOptions();
        drawWheel();
      }

      requestAnimationFrame(animate);
    }

    function renderOptions() {
      optionList.innerHTML = "";
      optionEmpty.classList.toggle("hidden", wheelOptions.length > 0);
      const optionsCollapsed = localStorage.getItem(storageKeys.optionsCollapsed) === "true";
      optionList.classList.toggle("is-collapsed", optionsCollapsed);
      optionEmpty.classList.toggle("is-collapsed", optionsCollapsed);
      collapseOptionsButton.textContent = optionsCollapsed ? "展开" : "折叠";
      collapseOptionsButton.title = optionsCollapsed ? "展开选项" : "折叠选项";
      collapseOptionsButton.setAttribute("aria-label", collapseOptionsButton.title);
      spinButton.disabled = wheelOptions.length < 2 || isSpinning;
      spinButton.textContent = isSpinning ? "转动中..." : "开始抽奖";

      wheelOptions.forEach((option, index) => {
        const item = document.createElement("li");
        item.className = `option-item${option.id === selectedOptionId ? " selected" : ""}`;
        item.dataset.id = option.id;
        item.dataset.index = index;
        item.innerHTML = `
          <span class="option-text">${escapeHtml(option.title)}</span>
          <div class="item-actions">
            <button class="icon-btn" type="button" data-action="edit" title="编辑">✎</button>
            <button class="icon-btn danger" type="button" data-action="delete" title="删除">×</button>
          </div>
        `;
        optionList.appendChild(item);
      });

      drawWheel();
    }

    optionForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const title = optionInput.value.trim();
      if (!title) return;
      addOption(title);
      optionInput.value = "";
      spinResult.textContent = "";
    });

    optionList.addEventListener("click", (event) => {
      const item = event.target.closest(".option-item");
      if (!item) return;
      const option = wheelOptions.find((entry) => entry.id === item.dataset.id);
      const optionIndex = Number(item.dataset.index);
      if (!option || isSpinning) return;

      if (event.target.dataset.action === "delete") {
        deleteOption(optionIndex);
        spinResult.textContent = "";
      }

      if (event.target.dataset.action === "edit") {
        const nextTitle = prompt("编辑转盘选项", option.title);
        if (nextTitle !== null && nextTitle.trim()) {
          option.title = nextTitle.trim();
          spinResult.textContent = "";
          saveWheels();
          renderOptions();
          drawWheel();
        }
      }
    });

    spinButton.addEventListener("click", spinWheel);
    collapseOptionsButton.addEventListener("click", () => {
      const next = localStorage.getItem(storageKeys.optionsCollapsed) !== "true";
      localStorage.setItem(storageKeys.optionsCollapsed, String(next));
      renderOptions();
    });
    prevDayButton.addEventListener("click", prevDay);
    nextDayButton.addEventListener("click", nextDay);
    prevWheelButton.addEventListener("click", prevWheel);
    nextWheelButton.addEventListener("click", nextWheel);
    createWheelButton.addEventListener("click", () => {
      const name = prompt("新建转盘名称", "新的转盘");
      if (name !== null) createNewWheel(name);
    });
    editWheelButton.addEventListener("click", () => {
      if (isSpinning) return;
      const wheel = currentWheel();
      const name = prompt("编辑转盘名称", wheel.name);
      if (name !== null && name.trim()) {
        wheel.name = name.trim();
        saveWheels();
        renderWheelShell();
      }
    });
    deleteWheelButton.addEventListener("click", deleteCurrentWheel);
    syncButton.addEventListener("click", enableCloudSync);

    async function init() {
      syncCode = localStorage.getItem(storageKeys.syncCode) || "";
      updateSyncButton();
      migrateTodoStorage();
      migrateWheelStorage();
      habits = normalizeHabits(load(storageKeys.habits, []));
      todoDate.value = todayDate;
      avatarPreview.src = localStorage.getItem(storageKeys.avatar) || defaultAvatar;
      applyTheme(localStorage.getItem(storageKeys.theme) || "light");
      const bootstrapped = await bootstrapCloudData();
      if (!bootstrapped) {
        renderHabits();
        loadTodosByDate(todayDate);
        loadWheel(currentWheelIndex);
      }
      cloudSavePaused = false;
      setupSwipe(todoPanel, prevDay, nextDay);
      setupSwipe(wheelSlide, nextWheel, prevWheel);
      scheduleReminders();
    }

    init();
  </script>
</body>
</html>
